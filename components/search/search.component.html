<div
  class="d-flex align-items-center fake-container"
  *ngIf="!showSearch"
  [ngClass]="{ isRunningInSaaS }">
  <span
    role="button"
    (click)="openLocalization()"
    class="fake-local nowrap"
    [ngClass]="{ isRunningInSaaS }">
    <ng-container *ngIf="locationSelected">{{ locationSelected.label }}</ng-container>
    <ng-container *ngIf="!locationSelected">Localização</ng-container>
  </span>
  <div class="fake-separator"></div>

  <span
    role="button"
    class="button-datepicker nowrap d-flex align-items-center"
    (click)="openDatepicker()">
    <span *ngIf="date" class="date-value">{{ date | date : 'dd/MM/YYYY' }}</span>
    <span *ngIf="!date">A partir de:</span>
    <i class="clina icon-calendar ms-2"></i>
  </span>

  <button
    type="button"
    class="btn btn-primary search-button"
    (click)="makeSearch()"
    [disabled]="loadingCoordinates"
    [ngClass]="{ isRunningInSaaS }">
    Buscar
  </button>
</div>

<div class="search-header" *ngIf="showSearch">
  Encontre o seu&nbsp;<span>consultório ideal</span>
</div>

<div class="search-container-backdrop" *ngIf="showSearch" (click)="close()"></div>

<div class="search-container" [ngClass]="{ visible: showSearch }">
  <div class="container">
    <form autocomplete="off" class="search-content">
      <div class="search-row">
        <div class="cl-field search-field search-field-location">
          <label class="cl-label" for="location">Localização</label>
          <span class="search-field-icon" aria-hidden="true"><i class="clina icon-pin"></i></span>
          <clina-navbar-location-dropdown
            label="Digite cidade, bairro, cep ou local"
            [list]="locationsList"
            [selected]="locationSelectedToDrop"
            [loading]="loadingGooglePlaces"
            inputId="location"
            (handleChange)="changeLocationKeyword($event)"
            (handleSelect)="selectLocation($event)">
          </clina-navbar-location-dropdown>
        </div>

        <div class="cl-field search-field search-field-date">
          <label class="cl-label" for="date">A partir de</label>
          <span class="search-field-icon" aria-hidden="true"><i class="clina icon-calendar"></i></span>
          <input
            id="date"
            name="date"
            type="date"
            class="cl-input"
            [ngModel]="dateInputValue"
            (ngModelChange)="setStartDateFromInput($event)" />
        </div>

        <button
          type="button"
          class="btn-search"
          [disabled]="loadingCoordinates"
          (click)="makeSearch()">
          <i class="clina icon-search" aria-hidden="true"></i>
          <span>Buscar</span>
        </button>
      </div>
    </form>
  </div>
</div>
